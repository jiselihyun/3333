 const section=document.createElement('div');section.className='slide'+(i===0?' active':'');section.setAttribute('role','img');section.setAttribute('aria-label',`슬라이드 ${i+1}: ${s.title}. ${s.points.join('. ')}`);const img=document.createElement('img');img.src=`assets/slide-${two(i+1)}.webp`;img.alt=`${s.title} - 원본 PPT 슬라이드`;img.loading=i<2?'eager':'lazy';img.decoding='async';img.draggable=false;section.append(img);stage.append(section);

function notesRender(){const s=slides[current];$('#notesBody').innerHTML=`<div class="eyebrow">SLIDE ${two(current+1)} / 10</div><h2>${s.title}</h2><ul>${s.points.map(p=>`<li>${p}</li>`).join('')}</ul><div class="note-disclaimer"><strong>자료 사용 시 확인 사항</strong><br>${s.notice}</div><p class="sources">원본 슬라이드의 표현을 기반으로 작성했습니다. 이미지와 삽화는 홍보용 생성 이미지이며 실제 축제 현장 사진이 아닙니다.</p>`;}
function go(index){if(index<0||index>=slides.length||index===current)return;const old=current;current=index;slideEls[old].classList.remove('active');slideEls[old].classList.toggle('exit-left',index>old);slideEls[current].classList.remove('exit-left');slideEls[current].classList.add('active');update();location.hash=`slide-${current+1}`;}
function update(){const s=slides[current];$('#slideTitle').textContent=s.title;$('#slideSummary').textContent=s.subtitle;$('#currentNum').textContent=two(current+1);$('#progressFill').style.width=`${(current+1)*10}%`;stepEls.forEach((el,i)=>{if(i===current)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current')});thumbEls.forEach((el,i)=>el.classList.toggle('selected',i===current));$('#prevBtn').disabled=current===0;$('#nextBtn').disabled=current===slides.length-1;notesRender();stepEls[current].scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});document.title=`${two(current+1)} ${s.title} | 2027 빵빵데이 천안`;}
function openOverview(){overviewOpen=true;$('#overview').classList.add('open');$('#closeOverview').focus()};function closeOverview(){overviewOpen=false;$('#overview').classList.remove('open');$('#overviewBtn').focus()};function toggleNotes(force){notesOpen=force??!notesOpen;$('#notesPanel').classList.toggle('open',notesOpen);$('#notesPanel').setAttribute('aria-hidden',String(!notesOpen));$('#notesBtn').setAttribute('aria-expanded',String(notesOpen));if(notesOpen)$('#closeNotes').focus()};
$('#overviewBtn').onclick=openOverview;$('#closeOverview').onclick=closeOverview;$('#overview').addEventListener('click',e=>{if(e.target===$('#overview'))closeOverview()});$('#notesBtn').onclick=()=>toggleNotes();$('#closeNotes').onclick=()=>toggleNotes(false);$('#prevBtn').onclick=()=>go(current-1);$('#nextBtn').onclick=()=>go(current+1);
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen?.();else $('#app').requestFullscreen?.()};$('#fullBtn').onclick=fullscreen;
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='Escape'){if(overviewOpen)closeOverview();else if(notesOpen)toggleNotes(false);return}if(overviewOpen)return;if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(9)}else if(e.key.toLowerCase()==='g')openOverview();else if(e.key.toLowerCase()==='i')toggleNotes();else if(e.key.toLowerCase()==='f')fullscreen()});
document.addEventListener('wheel',e=>{if(overviewOpen||notesOpen||e.target.closest('.steps'))return;if(Math.abs(e.deltaY)<9&&Math.abs(e.deltaX)<9)return;const now=Date.now();if(now-wheelTime<620)return;wheelTime=now;go(current+(Math.abs(e.deltaY)>Math.abs(e.deltaX)?Math.sign(e.deltaY):Math.sign(e.deltaX)))},{passive:true});
stage.addEventListener('touchstart',e=>{if(e.touches.length===1)touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});stage.addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.25)go(current+(dx<0?1:-1));touchStart=null},{passive:true});
const arr=(dir)=>{const b=document.createElement('button');b.className='sidearrow '+dir;b.setAttribute('aria-label',dir==='prev'?'이전 슬라이드':'다음 슬라이드');b.innerHTML=dir==='prev'?'<svg viewBox="0 0 24 24"><path d="m15 19-7-7 7-7"/></svg>':'<svg viewBox="0 0 24 24"><path d="m9 19 7-7-7-7"/></svg>';b.onclick=()=>go(current+(dir==='prev'?-1:1));stage.append(b);return b};const aPrev=arr('prev'),aNext=arr('next');
const originalUpdate=update;update=function(){originalUpdate();aPrev.disabled=current===0;aNext.disabled=current===9};
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#slide-(\d+)$/);if(m)go(Math.min(9,Math.max(0,Number(m[1])-1)))});
const initial=location.hash.match(/^#slide-(\d+)$/);if(initial)current=Math.min(9,Math.max(0,Number(initial[1])-1));slideEls.forEach((el,i)=>el.classList.toggle('active',i===current));update();
</script>
</body>
</html>
